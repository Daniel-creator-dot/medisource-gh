# SRAJ NOVA Workforce ERP on the existing free Render services.
# Service names stay the same so this does not create extra services.
# Free web services sleep after 15 minutes. The free Postgres database expires 30 days after creation.

services:
  - type: web
    name: medisource-gh-api
    runtime: python
    plan: free
    rootDir: sraj-nova/backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python boot_server.py
    healthCheckPath: /api/v1/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.17"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      # Supabase session pooler for project healynks. The password stays in the
      # Render dashboard so a blueprint sync cannot put it in git or switch
      # this service back to the marketplace database.
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        value: https://medisource-gh-web.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://medisource-gh-web.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://medisource-gh-web.onrender.com
      - key: MFA_REQUIRED_FOR_AGENCY_OWNER
        value: "false"
      - key: FORCE_SEED_DEMO
        value: "true"
      - key: SEED_DEMO_PASSWORD
        value: Demo-Only-Change-Me-1

  - type: web
    name: medisource-gh-web
    runtime: node
    plan: free
    rootDir: sraj-nova/apps/command-web
    buildCommand: npm install && npm run build
    startCommand: npx next start -H 0.0.0.0 -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "24.22.1"
      - key: API_URL
        value: https://medisource-gh-api.onrender.com

databases:
  - name: medisource-gh-db
    plan: free
    postgresMajorVersion: "16"
    databaseName: medisource
    user: medisource
