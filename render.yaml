# Free Render blueprint for the MediSource GH demo.
# Free web services sleep after 15 minutes without traffic.
# The free Postgres database expires 30 days after it is created.

services:
  - type: web
    name: medisource-gh-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate && python manage.py seed_demo
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /api/v1/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.17"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: medisource-gh-db
          property: connectionString
      - key: WEB_ORIGIN
        value: https://medisource-gh-web.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://medisource-gh-web.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://medisource-gh-web.onrender.com
      - key: MFA_REQUIRED_FOR_PRIVILEGED
        value: "true"
      - key: FORCE_SEED_DEMO
        value: "true"
      - key: SEED_DEMO_PASSWORD
        value: Demo-Only-Change-Me-1

  - type: web
    name: medisource-gh-web
    runtime: node
    plan: free
    buildCommand: npm install && npm run build --workspace @medisource/marketplace-web
    startCommand: npm exec --workspace @medisource/marketplace-web -- next start -H 0.0.0.0 -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "24.22.1"
      - key: NEXT_PUBLIC_API_URL
        value: https://medisource-gh-api.onrender.com
      - key: API_URL_INTERNAL
        value: https://medisource-gh-api.onrender.com
      - key: NEXT_PUBLIC_ENVIRONMENT
        value: render

databases:
  - name: medisource-gh-db
    plan: free
    postgresMajorVersion: "16"
    databaseName: medisource
    user: medisource
