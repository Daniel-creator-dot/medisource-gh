services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: srajnova
      POSTGRES_USER: srajnova
      POSTGRES_PASSWORD: srajnova
    ports:
      - "5433:5432"
    volumes:
      - nova_pg:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  api:
    build: ./backend
    depends_on:
      - db
      - redis
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: local-dev-only-not-for-production
      DJANGO_DEBUG: "true"
      DATABASE_URL: postgres://srajnova:srajnova@db:5432/srajnova
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:3010
      CSRF_TRUSTED_ORIGINS: http://localhost:3010
    ports:
      - "8010:8000"
volumes:
  nova_pg:
